# A VM with an encrypted data volume, the case a passphrase rotation works on.
# The root disk comes from an OS image, the data disk is a LUKS2 volume that
# the volume provider formats through librbd and QEMU opens through librbd.
#
# The passphrase below is a fixed test value. Never reuse it.
apiVersion: v1
kind: Secret
metadata:
  name: data-passphrase
stringData:
  # base64 of 32 bytes
  encryptionKey: bGFiLW9ubHktdGVzdC1wYXNzcGhyYXNlLTMyLWJ5dGU=
---
apiVersion: storage.ironcore.dev/v1alpha1
kind: Volume
metadata:
  name: data
spec:
  volumeClassRef:
    name: general-purpose
  resources:
    storage: 1Gi
  encryption:
    secretRef:
      name: data-passphrase
---
apiVersion: compute.ironcore.dev/v1alpha1
kind: Machine
metadata:
  name: lab-vm
spec:
  machineClassRef:
    name: t3-small
  ignitionRef:
    name: lab-vm-ignition
  networkInterfaces:
    - name: default
      networkInterfaceRef:
        name: lab-vm
  volumes:
    - name: rootdisk
      localDisk:
        image: ghcr.io/ironcore-dev/gardenlinux/gardener:2150.4.0-kvm
    - name: data
      volumeRef:
        name: data
---
apiVersion: networking.ironcore.dev/v1alpha1
kind: Network
metadata:
  name: lab-vm
---
apiVersion: networking.ironcore.dev/v1alpha1
kind: VirtualIP
metadata:
  name: lab-vm
spec:
  ipFamily: IPv4
  type: Public
---
apiVersion: networking.ironcore.dev/v1alpha1
kind: NetworkInterface
metadata:
  name: lab-vm
spec:
  networkRef:
    name: lab-vm
  ipFamilies:
    - IPv4
  ips:
    - value: 10.0.0.1
  virtualIP:
    virtualIPRef:
      name: lab-vm
---
# Login ironcore / best123, the ignition of the ironcore-in-a-box examples.
apiVersion: v1
kind: Secret
metadata:
  name: lab-vm-ignition
data:
  ignition.yaml: 
